[pytest]
# ── Test discovery ──────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── asyncio mode ───────────────────────────────────────────────────────────────
# Required for pytest-asyncio to handle async test functions automatically.
asyncio_mode = auto

# ── Output ─────────────────────────────────────────────────────────────────────
# -v  → verbose (shows each test name)
# -s  → don't capture stdout (useful to see log output during debugging)
addopts = -v --tb=short

# ── Markers ─────────────────────────────────────────────────────────────────────
markers =
    unit: Pure unit tests with no I/O (database or filesystem).
    integration: Tests that require a live PostgreSQL database.
    slow: Tests that are expected to take more than a few seconds.
